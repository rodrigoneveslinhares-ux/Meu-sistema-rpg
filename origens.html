<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Origens</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .origem {
            background: #181818;
            border: 1px solid #444;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .cabecalho-origem {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .nome-origem {
            font-size: 18px;
        }

        .seta {
            transition: transform 0.2s;
        }

        .descricao {
            display: none;
            padding: 12px 16px 16px 16px;
            color: #aaa;
            border-top: 1px solid #333;
            line-height: 1.5;
        }

        .origem.aberta .descricao {
            display: block;
        }

        .origem.aberta .seta {
            transform: rotate(180deg);
        }

        .origem.selecionada {
            border: 2px solid white;
        }

        .continuar {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: #292929;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .continuar:hover {
            background: #3a3a3a;
        }
    </style>
</head>

<body>

    <div id="listaOrigens"></div>

    <button class="continuar" onclick="continuar()">
        CONTINUAR

            {
                nome: "Trambiqueiro",

            {

                descricao: "Dedicação — Você recebe +1 PE por nível/NEX que avançar (retroativo)."
            },

            {
                nome: "Vítima",
                descricao: "Cicatrizes Psicológicas — Você recebe +5 em testes de Vontade contra habilidades de criaturas paranormais e começa o jogo com +5 de Sanidade máxima."
            }

        ];


        const lista =
            document.getElementById("listaOrigens");


        origens.forEach((origem) => {

            const div =
                document.createElement("div");

            div.className = "origem";

            div.innerHTML = `

                <div
                    class="cabecalho-origem"
                    onclick="selecionar(this.parentElement)"
                >

                    <span class="nome-origem">
                        ${origem.nome}
                    </span>

                    <span
                        class="seta"
                        onclick="abrirDescricao(event, this)"
                    >
                        ▼
                    </span>

                </div>

                <div class="descricao">
                    <strong>${origem.descricao.split(" — ")[0]}</strong>
                    ${origem.descricao.includes(" — ")
                        ? " — " + origem.descricao.split(" — ").slice(1).join(" — ")
                        : ""}
                </div>

            `;

            lista.appendChild(div);

        });


        function abrirDescricao(evento, seta) {

            evento.stopPropagation();

            const origem =
                seta.parentElement.parentElement;

            origem.classList.toggle("aberta");

        }


        function selecionar(elemento) {

            document
                .querySelectorAll(".origem")
                .forEach(origem => {

                    origem.classList.remove(
                        "selecionada"
                    );

                });


            elemento.classList.add(
                "selecionada"
            );


            localStorage.setItem(
                "origem",
                elemento
                    .querySelector(".nome-origem")
                    .textContent
            );

        }


        function continuar() {

            const origemSelecionada =
                localStorage.getItem("origem");


            if (!origemSelecionada) {

                alert(
                    "Escolha uma origem antes de continuar."
                );

                return;
            }


            window.location.href =
                "atributos.html";

        }
