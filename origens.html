        function abrirDescricao(evento, seta) {

            evento.stopPropagation();

            const origem =
                seta.parentElement.parentElement;

            origem.classList.toggle("aberta");

        }

        function selecionar(elemento) {

            document
                .querySelectorAll(".origem")
                .forEach(origem => {
                    origem.classList.remove("selecionada");
                });

            elemento.classList.add("selecionada");

            const nome =
                elemento
                .querySelector(".nome-origem")
                .textContent
                .trim();

            const origemEscolhida =
                origens.find(
                    origem => origem.nome === nome
                );

            localStorage.setItem(
                "origem",
                nome
            );

            const bonusPericias = {};

            if (origemEscolhida) {

                origemEscolhida.pericias.forEach(
                    pericia => {
                        bonusPericias[pericia] = 1;
                    }
                );

            }

            localStorage.setItem(
                "bonusPericias",
                JSON.stringify(bonusPericias)
            );

        }

        function continuar() {

            const origemSelecionada =
                localStorage.getItem("origem");

            if (!origemSelecionada) {

                alert(
                    "Escolha uma origem antes de continuar."
                );

                return;
            }

            window.location.href =
                "atributos.html";
