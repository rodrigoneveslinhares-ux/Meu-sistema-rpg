<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origens</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;padding:20px}
h1{color:#00ff66;text-align:center}
#lista{max-width:700px;margin:auto}
.origem{background:#151515;border:1px solid #00ff66;border-radius:8px;margin:10px 0;padding:15px}
.origem button{width:100%;background:none;color:#00ff66;border:0;text-align:left;font-size:17px;font-weight:bold;cursor:pointer}
.descricao{display:none;color:#ddd;padding-top:10px}
button.avancar{display:block;width:100%;max-width:700px;margin:20px auto;padding:15px;background:#00ff66;color:#000;border:0;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<h1>Escolha sua origem</h1>
<div id="lista"></div>
<button class="avancar" onclick="avancar()">Continuar</button>
<script>
const j=sessionStorage.getItem("jogadorAtual");
if(!["Brayan","Vitor","Sofia"].includes(j))location.replace("jogadores.html");
const key=k=>"jogador_"+j.toLowerCase()+"_"+k;

const origens=[
"Acadêmico","Agente de Saúde","Amigo dos Animais","Amnésico","Artista",
"Astronauta","Atleta","Blaster","Body Builder","Chef","Chef do Outro Lado",
"Cientista Forense","Colegial","Cosplayer","Criminoso","Cultista Arrependido",
"Desgarrado","Diplomata","Dublê","Engenheiro","Espírito","Executivo",
"Experimento","Explorador","Fanático","Fotógrafo","Gaudério Abutre",
"Ginasta","Investigador","Inventor","Jornalista","Legista","Lutador",
"Magnata","Mateiro","Mercenário","Mergulhador","Militar","Místico",
"Motorista","Nerd","Operário","Personal Trainer","Policial","Professor",
"Profetizado","Psicólogo","Religioso","Repórter","Revoltado",
"Servidor Público","T.I.","Teórico da Conspiração","Trabalhador Rural",
"Trambiqueiro","Universitário","Vítima"
];

const lista=document.getElementById("lista");
let escolhida=localStorage.getItem(key("origem"))||"";

origens.forEach(nome=>{
const div=document.createElement("div");
div.className="origem";
const botao=document.createElement("button");
botao.textContent=(escolhida===nome?"✓ ":"＋ ")+nome;
const descricao=document.createElement("div");
descricao.className="descricao";
descricao.textContent="Origem selecionada: "+nome+".";
botao.onclick=()=>{
escolhida=nome;
localStorage.setItem(key("origem"),nome);
document.querySelectorAll(".origem button").forEach(b=>b.textContent="＋ "+b.textContent.replace(/^✓ |^＋ /,""));
botao.textContent="✓ "+nome;
document.querySelectorAll(".descricao").forEach(d=>d.style.display="none");
descricao.style.display="block";
};
div.append(botao,descricao);
lista.appendChild(div);
if(escolhida===nome)descricao.style.display="block";
});

function avancar(){
if(!escolhida){alert("Escolha uma origem.");return;}
location.href="atributos.html";
}
</script>
</body>
</html>
