<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origens</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .origem {
            background: #181818;
            border: 1px solid #444;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .cabecalho-origem {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .nome-origem {
            font-size: 18px;
        }

        .seta {
            transition: transform 0.2s;
        }

        .descricao {
            display: none;
            padding: 0 16px 16px 16px;
            color: #aaa;
            border-top: 1px solid #333;
            padding-top: 12px;
        }

        .origem.aberta .descricao {
            display: block;
        }

        .origem.aberta .seta {
            transform: rotate(180deg);
        }

        .origem.selecionada {
            border: 2px solid white;
        }

        .continuar {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: #292929;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 18px;

    <button class="continuar" onclick="continuar()">
        CONTINUAR
    </button>

    <script>
        const origens = [
            "Lutador",
            "Professor",
            "Apresentador",
            "Atleta",
            "Acadêmico",
            "Agente de Saúde",
            "Amigo dos Animais",
            "Amnésico",
            "Artista",
            "Astronauta",
            "Blaster",
            "Body Builder",
            "Chef",
            "Chef do Outro Lado",
            "Cientista Forense",
            "Colegial",
            "Cosplayer",
            "Criminoso",
            "Cultista Arrependido",
            "Desgarrado",
            "Diplomata",
            "Dublê",
            "Engenheiro",
            "Espírito",
            "Executivo",
            "Experimento",
            "Explorador",
            "Fanático",
            "Fotógrafo",
            "Gaudério Abutre",
            "Ginasta",
            "Investigador",
            "Inventor",
            "Jornalista",
            "Legista",
            "Magnata",
            "Mateiro",
            "Mercenário",
            "Mergulhador",
            "Militar",
            "Místico",
            "Motorista",
            "Nerd",
            "Operário",
            "Personal Trainer",
            "Policial",
            "Profetizado",
            "Psicólogo",
            "Religioso",
            "Repórter",
            "Revoltado",
            "Servidor Público",
            "T.I.",
            "Teórico da Conspiração",
            "Trabalhador Rural",
            "Trambiqueiro",
            "Universitário",
            "Vítima"
        ];

        const lista = document.getElementById("listaOrigens");

        origens.forEach(nome => {
            const div = document.createElement("div");
            div.className = "origem";

            div.innerHTML = `
                <div class="cabecalho-origem"
                     onclick="selecionar(this.parentElement)">
                    <span class="nome-origem">${nome}</span>

                    <span class="seta"
                          onclick="abrirDescricao(event, this)">
                        ▼
                    </span>
                </div>

                <div class="descricao">
                    Descrição ainda não adicionada.
                </div>
            `;

            lista.appendChild(div);
        });

        function abrirDescricao(evento, seta) {
            evento.stopPropagation();

            const origem = seta.parentElement.parentElement;

            origem.classList.toggle("aberta");
        }

        function selecionar(elemento) {
            document.querySelectorAll(".origem").forEach(origem => {
                origem.classList.remove("selecionada");
            });

            elemento.classList.add("selecionada");

            localStorage.setItem(
                "origem",
                elemento.querySelector(".nome-origem").textContent
            );
        }

        function continuar() {
            const origemSelecionada =
                localStorage.getItem("origem");

            if (!origemSelecionada) {
                alert("Escolha uma origem antes de continuar.");
                return;
            }

            window.location.href = "atributos.html";
        }
    </script>

</body>
</html>
```
