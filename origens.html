
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origens - Desastre Milenar</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;padding:20px;background:#050505;color:#fff;
    font-family:Arial,sans-serif
}
main{max-width:850px;margin:auto}
header{text-align:center;margin-bottom:25px}
h1{color:#39ff14}
#jogadorInfo{color:#aaa}
.origem{
    margin-bottom:12px;background:#111;
    border:1px solid #333;border-radius:9px;overflow:hidden
}
.origem-titulo{
    display:block;width:100%;padding:16px;
    border:0;background:#111;color:#39ff14;
    text-align:left;font-size:17px;font-weight:bold;cursor:pointer
}
.origem-titulo:hover{background:#1b1b1b}
.detalhes{display:none;padding:0 16px 16px;color:#ddd}
.selecionar{
    padding:12px;width:100%;border:0;border-radius:6px;
    background:#39ff14;color:#000;font-weight:bold;cursor:pointer
}
.botoes{display:flex;gap:10px;margin:20px 0}
.botoes a{
    flex:1;padding:13px;text-align:center;text-decoration:none;
    color:#39ff14;border:1px solid #39ff14;border-radius:7px
}
#mensagem{text-align:center;color:#39ff14}
</style>
</head>

<body>
<main>
<header>
    <h1>ESCOLHA SUA ORIGEM</h1>
    <p id="jogadorInfo"></p>
</header>

<div class="botoes">
    <a href="index.html">Voltar</a>
    <a href="atributos.html" id="continuar">Continuar</a>
</div>

<p id="mensagem"></p>
<div id="listaOrigens"></div>
</main>

<script>
(function(){
    const jogador = sessionStorage.getItem("jogadorAtual");

    document.getElementById("jogadorInfo").textContent =
        jogador ? "Jogador: " + jogador : "Criando personagem";

    const origens = [
        "Acadêmico","Agente de Saúde","Amigo dos Animais","Amnésico",
        "Artista","Astronauta","Atleta","Blaster","Body Builder","Chef",
        "Chef do Outro Lado","Cientista Forense","Colegial","Cosplayer",
        "Criminoso","Cultista Arrependido","Desgarrado","Diplomata","Dublê",
        "Engenheiro","Espírito","Executivo","Experimento","Explorador",
        "Fanático","Fotógrafo","Gaudério Abutre","Ginasta","Investigador",
        "Inventor","Jornalista","Legista","Lutador","Magnata","Mateiro",
        "Mercenário","Mergulhador","Militar","Místico","Motorista","Nerd",
        "Operário","Personal Trainer","Policial","Professor","Profetizado",
        "Psicólogo","Religioso","Repórter","Revoltado","Servidor Público",
        "T.I.","Teórico da Conspiração","Trabalhador Rural","Trambiqueiro",
        "Universitário","Vítima"
    ];

    const chave = "jogador_" +
        (jogador || "visitante").toLowerCase() + "_origem";

    const lista = document.getElementById("listaOrigens");
    const mensagem = document.getElementById("mensagem");

    origens.forEach(nome => {
        const bloco = document.createElement("section");
        bloco.className = "origem";

        const titulo = document.createElement("button");
        titulo.className = "origem-titulo";
        titulo.type = "button";
        titulo.textContent = "▼ " + nome;

        const detalhes = document.createElement("div");
        detalhes.className = "detalhes";

        const descricao = document.createElement("p");
        descricao.textContent = "Selecione esta origem para sua personagem.";

        const selecionar = document.createElement("button");
        selecionar.className = "selecionar";
        selecionar.type = "button";
        selecionar.textContent = "Selecionar origem";

        titulo.addEventListener("click", () => {
            detalhes.style.display =
                detalhes.style.display === "block" ? "none" : "block";
        });

        selecionar.addEventListener("click", () => {
            localStorage.setItem(chave, nome);
            mensagem.textContent = "Origem selecionada: " + nome;
        });

        detalhes.append(descricao, selecionar);
        bloco.append(titulo, detalhes);
        lista.appendChild(bloco);
    });

    document.getElementById("continuar").addEventListener("click", event => {
        if (!localStorage.getItem(chave)) {
            event.preventDefault();
            mensagem.textContent = "Selecione uma origem antes de continuar.";
        }
    });
})();
</script>
</body>
</html>
