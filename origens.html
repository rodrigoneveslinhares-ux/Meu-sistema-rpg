
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origens - Desastre Milenar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

h1 {
    color: #00ff66;
    text-align: center;
}

#lista {
    max-width: 700px;
    margin: auto;
}

.origem {
    background: #151515;
    border: 1px solid #00ff66;
    border-radius: 8px;
    margin: 10px 0;
    padding: 15px;
}

.origem button {
    width: 100%;
    background: none;
    color: #00ff66;
    border: 0;
    text-align: left;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    overflow-wrap: anywhere;
}

.descricao {
    display: none;
    color: #ddd;
    padding-top: 10px;
    line-height: 1.5;
}

.origem.selecionada {
    border-color: #00ff66;
    box-shadow: 0 0 8px #00ff6630;
}

button.avancar {
    display: block;
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    padding: 15px;
    background: #00ff66;
    color: #000;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button.avancar:hover {
    background: #39ff85;
}

button.voltar {
    display: block;
    width: 100%;
    max-width: 700px;
    margin: 10px auto;
    padding: 13px;
    background: #151515;
    color: #00ff66;
    border: 1px solid #00ff66;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

#mensagem {
    text-align: center;
    color: #ff6868;
    margin: 15px auto;
    max-width: 700px;
}

@media (max-width: 480px) {
    body {
        padding: 14px;
    }

    .origem {
        padding: 12px;
    }
}
</style>
</head>

<body>

<h1>Escolha sua origem</h1>

<p id="mensagem" role="status"></p>

<div id="lista"></div>

<button class="avancar" id="botaoContinuar" type="button">
    Continuar
</button>

<button class="voltar" id="botaoVoltar" type="button">
    Voltar ao menu
</button>

<script>
"use strict";

/* Verifica se existe uma sessão de jogador */
const jogador = sessionStorage.getItem("jogadorAtual");
const token = sessionStorage.getItem("access_token");

if (!jogador || !token) {
    window.location.replace("Jogadores.html");
}

/* Identifica os dados deste jogador */
const chave = nome =>
    "jogador_" + jogador.toLowerCase() + "_" + nome;

/* Lista de origens */
const origens = [
    "Acadêmico",
    "Agente de Saúde",
    "Amigo dos Animais",
    "Amnésico",
    "Artista",
    "Astronauta",
    "Atleta",
    "Blaster",
    "Body Builder",
    "Chef",
    "Chef do Outro Lado",
    "Cientista Forense",
    "Colegial",
    "Cosplayer",
    "Criminoso",
    "Cultista Arrependido",
    "Desgarrado",
    "Diplomata",
    "Dublê",
    "Engenheiro",
    "Espírito",
    "Executivo",
    "Experimento",
    "Explorador",
    "Fanático",
    "Fotógrafo",
    "Gaudério Abutre",
    "Ginasta",
    "Investigador",
    "Inventor",
    "Jornalista",
    "Legista",
    "Lutador",
    "Magnata",
    "Mateiro",
    "Mercenário",
    "Mergulhador",
    "Militar",
    "Místico",
    "Motorista",
    "Nerd",
    "Operário",
    "Personal Trainer",
    "Policial",
    "Professor",
    "Profetizado",
    "Psicólogo",
    "Religioso",
    "Repórter",
    "Revoltado",
    "Servidor Público",
    "T.I.",
    "Teórico da Conspiração",
    "Trabalhador Rural",
    "Trambiqueiro",
    "Universitário",
    "Vítima"
];

const lista = document.getElementById("lista");
const mensagem = document.getElementById("mensagem");

let origemEscolhida = "";

try {
    origemEscolhida = localStorage.getItem(chave("origem")) || "";
} catch (erro) {
    origemEscolhida = "";
}

function mostrarMensagem(texto) {
    mensagem.textContent = texto;
}

function selecionarOrigem(nome, botao, descricao, cartao) {
    origemEscolhida = nome;

    try {
        localStorage.setItem(chave("origem"), nome);
    } catch (erro) {
        mostrarMensagem(
            "Não foi possível salvar a origem neste navegador."
        );
        return;
    }

    document.querySelectorAll(".origem").forEach(elemento => {
        elemento.classList.remove("selecionada");

        const botaoOrigem = elemento.querySelector("button");
        const descricaoOrigem = elemento.querySelector(".descricao");

        const nomeOriginal = botaoOrigem.dataset.nome;

        botaoOrigem.textContent = "＋ " + nomeOriginal;
        descricaoOrigem.style.display = "none";
    });

    botao.textContent = "✓ " + nome;
    cartao.classList.add("selecionada");
    descricao.style.display = "block";

    mostrarMensagem("");
}

origens.forEach(nome => {
    const cartao = document.createElement("div");
    cartao.className = "origem";

    const botao = document.createElement("button");
    botao.type = "button";
    botao.dataset.nome = nome;
    botao.textContent = "＋ " + nome;

    const descricao = document.createElement("div");
    descricao.className = "descricao";
    descricao.textContent =
        "Origem selecionada: " + nome + ".";

    botao.addEventListener("click", () => {
        selecionarOrigem(nome, botao, descricao, cartao);
    });

    cartao.appendChild(botao);
    cartao.appendChild(descricao);
    lista.appendChild(cartao);

    if (origemEscolhida === nome) {
        botao.textContent = "✓ " + nome;
        descricao.style.display = "block";
        cartao.classList.add("selecionada");
    }
});

/* Continua para a escolha dos atributos */
document.getElementById("botaoContinuar").addEventListener(
    "click",
    () => {
        if (!origemEscolhida) {
            mostrarMensagem("Escolha uma origem antes de continuar.");
            return;
        }

        window.location.href = "atributos.html";
    }
);

/* Volta ao menu */
document.getElementById("botaoVoltar").addEventListener(
    "click",
    () => {
        window.location.href = "index.html";
    }
);
</script>

</body>
</html>
