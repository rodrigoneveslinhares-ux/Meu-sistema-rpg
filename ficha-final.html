<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Ficha</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            padding-bottom: 100px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff66;
        }

        .campo {
            background: #181818;
            border: 1px solid #00ff66;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .titulo {
            font-size: 18px;
            margin-bottom: 10px;
            color: #00ff66;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background: #0b0b0b;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #00ff66;
            box-shadow: 0 0 5px #00ff6644;
        }

        .origem {
            font-size: 18px;
            color: #00ff66;
        }

        .menu-botao {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #181818;
            color: #00ff66;
            border: 1px solid #00ff66;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            transition: 0.2s;
        }

        .menu-botao:hover {
            background: #00ff66;
            color: #0b0b0b;
        }

        .menu {
            display: none;
            position: fixed;
            right: 20px;
            bottom: 85px;
            width: 180px;
            background: #181818;
            border: 1px solid #00ff66;
            border-radius: 10px;
            padding: 10px;
            z-index: 10;
        }

        .menu.aberto {
            display: block;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .menu a:hover {
            background: #00ff66;
            color: #0b0b0b;
        }

        .salvo {
            color: #00ff66;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>FINALIZAR FICHA</h1>

    <div class="campo">
        <div class="titulo">Nome do personagem:</div>
        <input
            type="text"
            id="nomePersonagem"
            placeholder="Digite o nome do personagem"
            autocomplete="off"
        >
    </div>

    <div class="campo">
        <div class="titulo">Nome do jogador:</div>
        <input
            type="text"
            id="nomeJogador"
            placeholder="Digite o nome do jogador"
            autocomplete="off"
        >
    </div>

    <div class="campo">
        <div class="titulo">Origem:</div>
        <div class="origem" id="origem">-</div>
    </div>

    <div class="salvo" id="avisoSalvo">
        Alterações salvas automaticamente.
    </div>

    <div class="menu" id="menu">
        <a href="ficha-final.html">📋 Ficha</a>
        <a href="atributos-ficha.html">❤️ Atributos</a>
        <a href="dados.html">🎲 Perícias e dados</a>
    </div>

    <button
        class="menu-botao"
        id="botaoMenu"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
    >☰</button>

    <script>
        const campoPersonagem = document.getElementById("nomePersonagem");
        const campoJogador = document.getElementById("nomeJogador");
        const avisoSalvo = document.getElementById("avisoSalvo");
        const menu = document.getElementById("menu");
        const botaoMenu = document.getElementById("botaoMenu");

        // Recupera os nomes salvos anteriormente.
        campoPersonagem.value =
            localStorage.getItem("nomePersonagem") || "";

        campoJogador.value =
            localStorage.getItem("nomeJogador") || "";

        // Mostra a origem escolhida.
        document.getElementById("origem").textContent =
            localStorage.getItem("origem") || "Nenhuma";

        // Salva automaticamente o nome do personagem.
        campoPersonagem.addEventListener("input", function () {
            localStorage.setItem(
                "nomePersonagem",
                campoPersonagem.value
            );

            mostrarSalvo();
        });

        // Salva automaticamente o nome do jogador.
        campoJogador.addEventListener("input", function () {
            localStorage.setItem(
                "nomeJogador",
                campoJogador.value
            );

            mostrarSalvo();
        });

        function mostrarSalvo() {
            avisoSalvo.textContent =
                "Alterações salvas automaticamente.";
        }

        // Abre e fecha o menu.
        function abrirMenu() {
            const aberto = menu.classList.toggle("aberto");

            botaoMenu.setAttribute(
                "aria-expanded",
                aberto ? "true" : "false"
            );
        }

        botaoMenu.addEventListener("click", abrirMenu);
    </script>

</body>
</html>
