<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha do Personagemm</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;padding:20px}
main{max-width:500px;margin:auto}
h1{color:#00ff66;text-align:center}
label{display:block;margin-top:18px}
input{width:100%;padding:13px;background:#171717;color:white;border:1px solid #00ff66;border-radius:7px;margin-top:7px}
button{width:100%;padding:14px;margin-top:15px;background:#00ff66;color:#000;border:0;border-radius:7px;font-weight:bold}
.menu{background:#171717;color:#00ff66;border:1px solid #00ff66}
</style>
</head>
<body>
<main>
<h1>Ficha do Personagem</h1>
<label>Nome do jogador</label>
<input id="jogador" readonly>
<label>Nome do personagem</label>
<input id="personagem" placeholder="Digite o nome do personagem">
<label>Origem</label>
<input id="origem" readonly>
<button onclick="salvar()">Salvar ficha</button>
<button class="menu" onclick="location.href='atributos-ficha.html'">Ficha e atributos</button>
<button class="menu" onclick="location.href='dados.html'">Dados e perícias</button>
<button class="menu" onclick="location.href='atributos.html'">Editar atributos</button>
<button class="menu" onclick="location.href='origens.html'">Trocar origem</button>
<button class="menu" onclick="location.href='index.html'">Início</button>
</main>
<script>
const j=sessionStorage.getItem("jogadorAtual");
if(!["Brayan","Vitor","Sofia"].includes(j))location.replace("jogadores.html");
const key=k=>"jogador_"+j.toLowerCase()+"_"+k;
document.getElementById("jogador").value=localStorage.getItem(key("nomeJogador"))||j;
document.getElementById("personagem").value=localStorage.getItem(key("nomePersonagem"))||"";
document.getElementById("origem").value=localStorage.getItem(key("origem"))||"Não selecionada";
function salvar(){
localStorage.setItem(key("nomeJogador"),j);
localStorage.setItem(key("nomePersonagem"),document.getElementById("personagem").value);
alert("Ficha salva!");
}
</script>
</body>
</html>
