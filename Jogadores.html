<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selecionar Jogador</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
main{width:90%;max-width:420px;text-align:center}
h1{color:#00ff66}
button,input{width:100%;padding:14px;margin:8px 0;border-radius:8px;font-size:16px}
button{background:#00ff66;border:0;color:#000;font-weight:bold;cursor:pointer}
input{background:#181818;color:white;border:1px solid #00ff66}
</style>
</head>
<body>
<main>
<h1>Selecionar jogador</h1>
<div id="jogadores"></div>
<input id="senha" type="password" placeholder="Senha do jogador">
<button onclick="entrar()">Entrar</button>
<p id="mensagem"></p>
</main>
<script>
const jogadores={
Brayan:"brayan123",
Vitor:"vitor123",
Sofia:"sofia123"
};
let selecionado="Brayan";
const area=document.getElementById("jogadores");

Object.keys(jogadores).forEach(nome=>{
const b=document.createElement("button");
b.textContent=nome;
b.onclick=()=>{
selecionado=nome;
document.querySelectorAll("#jogadores button").forEach(x=>x.style.opacity=".55");
b.style.opacity="1";
};
area.appendChild(b);
});

document.querySelector("#jogadores button").style.opacity="1";

function entrar(){
if(document.getElementById("senha").value!==jogadores[selecionado]){
document.getElementById("mensagem").textContent="Senha incorreta.";
return;
}
sessionStorage.setItem("jogadorAtual",selecionado);
location.href="index.html";
}
</script>
</body>
</html>
