
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desastre Natural</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            color: #00ff66;
            margin-bottom: 30px;
            font-size: 30px;
        }

        p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .jogador,
        .entrar {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background: #181818;
            color: #00ff66;
            border: 1px solid #00ff66;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .jogador:hover,
        .jogador.selecionado,
        .entrar:hover {
            background: #00ff66;
            color: #0b0b0b;
        }

        #painel {
            display: none;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: #181818;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 17px;
        }

        input:focus {
            outline: none;
            border-color: #00ff66;
        }

        #mensagem {
            min-height: 22px;
            color: #ff6666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>𝔇𝔢𝔰𝔞𝔰𝔱𝔯𝔢 𝔑𝔞𝔱𝔲𝔯𝔞𝔩</h1>

        <p>Selecione seu jogador para entrar.</p>

        <button class="jogador" type="button"
            onclick="selecionarJogador('Brayan', this)">
            Brayan
        </button>

        <button class="jogador" type="button"
            onclick="selecionarJogador('Vitor', this)">
            Vitor
        </button>

        <button class="jogador" type="button"
            onclick="selecionarJogador('Sofia', this)">
            Sofia
        </button>

        <div id="painel">
            <input
                id="senha"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

            <button class="entrar" type="button"
                onclick="verificarSenha()">
                ENTRAR
            </button>
        </div>

        <div id="mensagem"></div>
    </main>

    <script>
        const senhas = {
            Brayan: "brayan123",
            Vitor: "vitor123",
            Sofia: "sofia123"
        };

        let jogadorSelecionado = "";

        function selecionarJogador(nome, botao) {
            jogadorSelecionado = nome;

            document.querySelectorAll(".jogador").forEach(function (item) {
                item.classList.remove("selecionado");
            });

            botao.classList.add("selecionado");

            document.getElementById("painel").style.display = "block";
            document.getElementById("senha").value = "";
            document.getElementById("mensagem").textContent = "";

            document.getElementById("senha").focus();
        }

        function verificarSenha() {
            const senhaDigitada =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");

            if (!jogadorSelecionado) {
                mensagem.textContent = "Selecione um jogador.";
                return;
            }

            if (senhas[jogadorSelecionado] === senhaDigitada) {
                sessionStorage.setItem(
                    "jogadorAtual",
                    jogadorSelecionado
                );

                window.location.href = "index.html";
            } else {
                mensagem.textContent = "Senha incorreta.";
            }
        }

        document.getElementById("senha").addEventListener(
            "keydown",
            function (evento) {
                if (evento.key === "Enter") {
                    verificarSenha();
                }
            }
        );
    </script>
</body>
</html>
