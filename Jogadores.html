
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogadores - Desastre Milenar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px 15px 125px;
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 20px 0;
    border-bottom: 1px solid #39ff14;
}

h1 {
    color: #39ff14;
    text-shadow: 0 0 12px #39ff1470;
    margin: 0;
}

main {
    width: 100%;
    max-width: 440px;
    margin: 25px auto;
}

h2 {
    color: #39ff14;
    font-size: 20px;
}

.card {
    padding: 18px;
    margin-bottom: 18px;
    background: #121212;
    border: 1px solid #333;
    border-radius: 10px;
}

label {
    display: block;
    margin-top: 12px;
    font-size: 14px;
}

input {
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #080808;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: 0;
    border-radius: 7px;
    background: #39ff14;
    color: #000;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

#mensagem {
    min-height: 22px;
    text-align: center;
    overflow-wrap: anywhere;
    line-height: 1.4;
}

.sucesso {
    color: #39ff14;
}

.erro {
    color: #ff5555;
}

#listaJogadores {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.jogador-item {
    padding: 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #191919;
    overflow-wrap: anywhere;
}

.aviso {
    color: #aaa;
    font-size: 12px;
    line-height: 1.5;
}

/* FAIXA DE PROPAGANDAS */
#barra-propagandas {
    position: fixed;
    z-index: 9999;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 94px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    overflow-x: auto;
    background: #101010;
    border-top: 2px solid #39ff14;
    box-shadow: 0 -4px 18px #0009;
    overscroll-behavior-x: contain;
}

.anuncio {
    display: flex;
    align-items: center;
    flex: 0 0 260px;
    min-width: 0;
    height: 72px;
    gap: 10px;
    padding: 6px;
    overflow: hidden;
    border: 1px solid #333;
    border-radius: 8px;
    background: #191919;
    color: white;
    text-decoration: none;
}

.anuncio img {
    width: 94px;
    height: 58px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 5px;
    background: #252525;
}

.anuncio-texto {
    min-width: 0;
    overflow: hidden;
}

.anuncio-titulo {
    display: block;
    color: #39ff14;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.anuncio-descricao {
    display: -webkit-box;
    margin-top: 5px;
    color: #ccc;
    font-size: 11px;
    line-height: 1.3;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
}

.rotulo-publicidade {
    position: absolute;
    top: 2px;
    right: 8px;
    color: #888;
    font-size: 9px;
}

@media (max-width: 480px) {
    body {
        padding: 12px 12px 115px;
    }

    header {
        padding: 18px 0;
    }

    .card {
        padding: 14px;
    }

    #barra-propagandas {
        min-height: 86px;
        padding: 9px 7px;
        gap: 8px;
    }

    .anuncio {
        flex-basis: 235px;
        height: 66px;
    }

    .anuncio img {
        width: 82px;
        height: 54px;
    }
}
</style>
</head>

<body>

<header>
    <h1>DESASTRE MILENAR</h1>
</header>

<main>
    <section class="card">
        <h2>Entrar</h2>

        <form id="formEntrar">
            <label for="nomeEntrar">Nome do jogador</label>
            <input id="nomeEntrar" type="text" maxlength="50"
                   autocomplete="username" required>

            <label for="senhaEntrar">Senha</label>
            <input id="senhaEntrar" type="password"
                   autocomplete="current-password" required>

            <button id="botaoEntrar" type="submit">Entrar</button>
        </form>
    </section>

    <section class="card">
        <h2>Criar jogador</h2>

        <form id="formCriar">
            <label for="nomeCriar">Nome do jogador</label>
            <input id="nomeCriar" type="text" maxlength="50"
                   autocomplete="username" required>

            <label for="senhaCriar">Criar senha</label>
            <input id="senhaCriar" type="password" minlength="6"
                   autocomplete="new-password" required>

            <label for="confirmarSenha">Confirmar senha</label>
            <input id="confirmarSenha" type="password"
                   minlength="6" autocomplete="new-password" required>

            <button id="botaoCriar" type="submit">Criar conta</button>
        </form>
        <p class="aviso">Use uma senha com pelo menos 6 caracteres.</p>
    </section>

    <section class="card">
        <h2>Jogadores cadastrados</h2>
        <div id="listaJogadores">Carregando jogadores...</div>
    </section>

    <p id="mensagem" aria-live="polite"></p>
</main>

<!-- PROPAGANDAS: aparecem somente nesta página -->
<aside id="barra-propagandas" aria-label="Propagandas">
    <span class="rotulo-publicidade">PUBLICIDADE</span>
</aside>

<script>
/*
 * SUPABASE
 * Mantém o endereço da Edge Function já usado no teu projeto.
 */
const ENDPOINT =
    "https://odjlvvmdkqzpexlcgkym.supabase.co/functions/v1/bright-action";

/*
 * PERSONALIZE AS PROPAGANDAS NESTA LISTA.
 * Troque as imagens e os links pelos endereços reais.
 */
const propagandas = [
    {
        titulo: "Minha propaganda",
        descricao: "Coloque aqui uma descrição curta.",
        imagem: "https://placehold.co/320x180/171717/00ff66?text=Sua+Imagem",
        link: "https://example.com"
    },
    {
        titulo: "Outra propaganda",
        descricao: "Divulgue seu projeto ou servidor.",
        imagem: "https://placehold.co/320x180/171717/ffffff?text=Outro+Anuncio",
        link: "https://example.com"
    }
];

function montarPropagandas() {
    const barra = document.getElementById("barra-propagandas");

    propagandas.forEach(propaganda => {
        const link = document.createElement("a");
        link.className = "anuncio";
        link.href = propaganda.link;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const imagem = document.createElement("img");
        imagem.src = propaganda.imagem;
        imagem.alt = propaganda.titulo;
        imagem.loading = "lazy";

        const texto = document.createElement("span");
        texto.className = "anuncio-texto";

        const titulo = document.createElement("span");
        titulo.className = "anuncio-titulo";
        titulo.textContent = propaganda.titulo;

        const descricao = document.createElement("span");
        descricao.className = "anuncio-descricao";
        descricao.textContent = propaganda.descricao;

        texto.appendChild(titulo);
        texto.appendChild(descricao);
        link.appendChild(imagem);
        link.appendChild(texto);
        barra.appendChild(link);
    });
}

montarPropagandas();

/* MENSAGENS */
function mostrarMensagem(texto, tipo = "") {
    const mensagem = document.getElementById("mensagem");
    mensagem.textContent = texto;
    mensagem.className = tipo;
}

/* CHAMADA À EDGE FUNCTION */
async function chamarFuncao(dados, token = "") {
    const headers = {
        "Content-Type": "application/json"
    };

    if (token) {
        headers.Authorization = "Bearer " + token;
    }

    const resposta = await fetch(ENDPOINT, {
        method: "POST",
        headers,
        body: JSON.stringify(dados)
    });

    const texto = await resposta.text();

    let resultado;

    try {
        resultado = texto ? JSON.parse(texto) : {};
    } catch {
        throw new Error("O servidor retornou uma resposta inválida.");
    }

    if (!resposta.ok) {
        throw new Error(
            resultado.erro ||
            resultado.error ||
            resultado.mensagem ||
            "Erro na comunicação com o servidor."
        );
    }

    if (resultado.erro || resultado.error) {
        throw new Error(resultado.erro || resultado.error);
    }

    return resultado;
}

/* LISTA DE JOGADORES */
async function carregarJogadores() {
    const lista = document.getElementById("listaJogadores");
    lista.textContent = "Carregando jogadores...";

    try {
        const resultado = await chamarFuncao({
            acao: "listar"
        });

        const jogadores =
            resultado.jogadores ||
            resultado.participantes ||
            resultado.data ||
            [];

        lista.replaceChildren();

        if (!Array.isArray(jogadores) || jogadores.length === 0) {
            lista.textContent = "Nenhum jogador cadastrado ainda.";
            return;
        }

        jogadores.forEach(item => {
            const nome = typeof item === "string"
                ? item
                : item.nome || item.name || item.username;

            if (!nome) return;

            const linha = document.createElement("div");
            linha.className = "jogador-item";
            linha.textContent = nome;
            lista.appendChild(linha);
        });

        if (!lista.childElementCount) {
            lista.textContent = "Nenhum jogador disponível.";
        }
    } catch (erro) {
        lista.textContent =
            "Não foi possível carregar a lista. Tu ainda pode tentar entrar ou criar uma conta.";
        console.error("Erro ao listar jogadores:", erro);
    }
}

/* CRIAR CONTA */
document.getElementById("formCriar").addEventListener("submit", async evento => {
    evento.preventDefault();

    const nome = document.getElementById("nomeCriar").value.trim();
    const senha = document.getElementById("senhaCriar").value;
    const confirmar = document.getElementById("confirmarSenha").value;
    const botao = document.getElementById("botaoCriar");

    if (!nome) {
        mostrarMensagem("Digite um nome de jogador.", "erro");
        return;
    }

    if (senha.length < 6) {
        mostrarMensagem("A senha precisa ter pelo menos 6 caracteres.", "erro");
        return;
    }

    if (senha !== confirmar) {
        mostrarMensagem("As senhas não coincidem.", "erro");
        return;
    }

    botao.disabled = true;
    botao.textContent = "Criando conta...";
    mostrarMensagem("");

    try {
        const resultado = await chamarFuncao({
            acao: "criar",
            nome,
            senha
        });

        if (resultado.sucesso === false) {
            throw new Error(resultado.mensagem || "Não foi possível criar a conta.");
        }

        mostrarMensagem(
            resultado.mensagem || "Conta criada! Agora tu pode entrar.",
            "sucesso"
        );

        document.getElementById("formCriar").reset();
        await carregarJogadores();
    } catch (erro) {
        mostrarMensagem(erro.message || "Erro ao criar a conta.", "erro");
    } finally {
        botao.disabled = false;
        botao.textContent = "Criar conta";
    }
});

/* ENTRAR */
document.getElementById("formEntrar").addEventListener("submit", async evento => {
    evento.preventDefault();

    const nome = document.getElementById("nomeEntrar").value.trim();
    const senha = document.getElementById("senhaEntrar").value;
    const botao = document.getElementById("botaoEntrar");

    if (!nome || !senha) {
        mostrarMensagem("Preencha o nome e a senha.", "erro");
        return;
    }

    botao.disabled = true;
    botao.textContent = "Entrando...";
    mostrarMensagem("");

    try {
        const resultado = await chamarFuncao({
            acao: "entrar",
            nome,
            senha
        });

        if (resultado.sucesso === false) {
            throw new Error(resultado.mensagem || "Nome ou senha incorretos.");
        }

        /*
         * Não apaga os dados salvos da ficha.
         * Apenas atualiza a sessão do jogador atual.
         */
        sessionStorage.setItem("jogadorAtual", nome);

        if (resultado.access_token) {
            sessionStorage.setItem("access_token", resultado.access_token);
        } else {
            sessionStorage.removeItem("access_token");
        }

        if (resultado.refresh_token) {
            sessionStorage.setItem("refresh_token", resultado.refresh_token);
        } else {
            sessionStorage.removeItem("refresh_token");
        }

        if (resultado.user_id) {
            sessionStorage.setItem("user_id", resultado.user_id);
        } else {
            sessionStorage.removeItem("user_id");
        }

        window.location.href = "index.html";
    } catch (erro) {
        mostrarMensagem(erro.message || "Não foi possível entrar.", "erro");
    } finally {
        botao.disabled = false;
        botao.textContent = "Entrar";
    }
});

/* CARREGAMENTO INICIAL */
carregarJogadores();
</script>

</body>
</html>
