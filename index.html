
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desastre Milenar</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;min-height:100vh;background:#050505;color:#fff;
    font-family:Arial,sans-serif;text-align:center
}
header{padding:28px 16px;border-bottom:1px solid #39ff14}
h1{color:#39ff14;text-shadow:0 0 12px #39ff1470;margin:0}
main{width:100%;max-width:650px;margin:35px auto;padding:20px}
#nomeJogador{
    color:#39ff14;font-size:21px;margin-bottom:28px;
    overflow-wrap:anywhere
}
.menu{display:flex;flex-direction:column;gap:15px}
.menu a,.botao-trocar{
    display:block;width:100%;padding:16px;border:1px solid #39ff14;
    border-radius:10px;background:#101010;color:#39ff14;
    font-size:17px;font-weight:bold;text-decoration:none;cursor:pointer;
    transition:background .2s,transform .2s
}
.menu a:hover,.botao-trocar:hover{
    background:#183016;transform:scale(1.02)
}
.botao-trocar{
    margin-top:28px;border-color:#666;color:#ddd;font-size:14px
}
footer{margin-top:35px;padding:15px;color:#666;font-size:12px}
</style>
</head>

<body>
<header>
    <h1>DESASTRE MILENAR</h1>
</header>

<main>
    <p id="nomeJogador">Carregando jogador...</p>

    <nav class="menu">
        <a href="origens.html" id="criarPersonagem">Criar personagem</a>
        <a href="fichas-salvas.html">Fichas salvas</a>
    </nav>

    <button class="botao-trocar" id="botaoTrocar" type="button">
        Trocar de jogador
    </button>
</main>

<footer>Desastre Milenar</footer>

<script>
(function(){
    const jogador = sessionStorage.getItem("jogadorAtual");

    if(!jogador){
        window.location.replace("Jogadores.html");
        return;
    }

    const chavePrefixo = "jogador_" + jogador.toLowerCase() + "_";

    document.getElementById("nomeJogador").textContent =
        "Jogador: " + jogador;

    document.getElementById("criarPersonagem").addEventListener("click", function(event){
        event.preventDefault();

        /*
         * Começa uma ficha nova sem apagar as fichas já salvas.
         * Os dados de trabalho são limpos para não copiar a ficha anterior.
         */
        for(let i = localStorage.length - 1; i >= 0; i--){
            const chave = localStorage.key(i);

            if(chave && chave.startsWith(chavePrefixo)){
                localStorage.removeItem(chave);
            }
        }

        sessionStorage.removeItem("fichaAtivaId");
        sessionStorage.removeItem("restaurarFichaSalva");

        window.location.href = "origens.html";
    });

    document.getElementById("botaoTrocar").addEventListener("click", function(){
        sessionStorage.removeItem("jogadorAtual");
        sessionStorage.removeItem("access_token");
        sessionStorage.removeItem("refresh_token");
        sessionStorage.removeItem("user_id");
        sessionStorage.removeItem("fichaAtivaId");
        sessionStorage.removeItem("restaurarFichaSalva");

        window.location.href = "Jogadores.html";
    });
})();
</script>
</body>
</html>
