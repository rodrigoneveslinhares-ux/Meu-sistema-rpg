
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desastre Milenar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #00ff66;
            font-size: 34px;
            margin-bottom: 12px;
        }

        .subtitulo {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .jogador-atual {
            color: #00ff66;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .botao {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            background: #181818;
            color: white;
            border: 1px solid #00ff66;
            border-radius: 10px;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
            transition: 0.2s;
        }

        .botao:hover {
            background: #00ff66;
            color: #0b0b0b;
        }

        .botao-secundario {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 15px;
            background: transparent;
            color: #999;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .botao-secundario:hover {
            color: #00ff66;
            border-color: #00ff66;
        }

        .rodape {
            margin-top: 35px;
            color: #666;
            font-size: 12px;
        }

        .aviso {
            margin-top: 20px;
            color: #ff7777;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>𝔡𝔢𝔰𝔞𝔰𝔱𝔯𝔢 𝔪𝔦𝔩𝔢𝔫𝔞𝔯</h1>

        <p class="subtitulo">
            Crie sua ficha e prepare-se para a investigação.
        </p>

        <div class="jogador-atual" id="jogadorAtual"></div>

        <a class="botao" id="criarFicha" href="origens.html">
            CRIAR FICHA
        </a>

        <button class="botao-secundario" type="button"
            onclick="trocarJogador()">
            TROCAR DE JOGADOR
        </button>

        <div class="aviso" id="aviso"></div>

        <div class="rodape">
            Sistema de RPG personalizado
            <br>
            feito por :kenshiel
        </div>
    </main>

    <script>
        /*
          O jogador é selecionado na página jogadores.html.
          A identificação é usada para separar os dados de cada jogador.
        */

        const jogador = sessionStorage.getItem("jogadorAtual");

        const jogadoresPermitidos = ["Brayan", "Vitor", "Sofia"];

        const nomeJogador = document.getElementById("jogadorAtual");
        const botaoCriar = document.getElementById("criarFicha");
        const aviso = document.getElementById("aviso");

        if (jogador && jogadoresPermitidos.includes(jogador)) {
            nomeJogador.textContent = "Jogador: " + jogador;
        } else {
            nomeJogador.textContent = "Nenhum jogador selecionado";
            botaoCriar.style.display = "none";
            aviso.style.display = "block";
            aviso.textContent =
                "Entre primeiro pela página jogadores.html e selecione seu jogador.";
        }

        function trocarJogador() {
            sessionStorage.removeItem("jogadorAtual");
            window.location.href = "jogadores.html";
        }
    </script>

</body>
</html>
