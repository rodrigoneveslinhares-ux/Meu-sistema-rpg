
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atributos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    margin: 0 0 32px;
    font-size: 28px;
}

.status {
    margin-bottom: 34px;
}

.status-titulo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.nome-status {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.nome-status h2 {
    margin: 0;
    font-size: 18px;
}

.icone-status {
    font-size: 25px;
    line-height: 1;
}

.maximo {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #ccc;
    white-space: nowrap;
}

.maximo input {
    width: 55px;
    padding: 5px;
    background: #222;
    color: white;
    border: 1px solid #555;
    text-align: center;
    font-size: 14px;
}

.barra-controles {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
}

.barra {
    flex: 1;
    min-width: 0;
    height: 12px;
    background: #444;
    border: 2px solid #000;
    border-radius: 0;
    overflow: hidden;
}

.preenchimento {
    width: 100%;
    height: 100%;
    border-radius: 0;
    transition: width 0.2s ease;
}

.vida {
    background: #e31324;
}

.sanidade {
    background: #2878e8;
}

.esforco {
    background: #f0a020;
}

.botoes-status {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

.botoes-status button {
    width: 29px;
    height: 27px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #292929;
    color: white;
    border: 1px solid #555;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.botoes-status button:hover {
    background: #444;
}

.valor-atual {
    min-width: 65px;
    text-align: center;
    font-size: 13px;
    white-space: nowrap;
}

.menu {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 10;
}

.menu-botao {
    width: 52px;
    height: 52px;
    border: 2px solid #555;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.menu-opcoes {
    display: none;
    position: absolute;
    right: 0;
    bottom: 62px;
    width: 160px;
    padding: 8px;
    background: #222;
    border: 1px solid #555;
}

.menu-opcoes.aberto {
    display: block;
}

.menu-opcoes a {
    display: block;
    padding: 12px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid #444;
}

.menu-opcoes a:last-child {
    border-bottom: none;
}

.menu-opcoes a:hover {
    background: #383838;
}

@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    h1 {
        font-size: 25px;
    }

    .status-titulo {
        flex-wrap: wrap;
    }

    .nome-status h2 {
        font-size: 16px;
    }

    .icone-status {
        font-size: 22px;
    }

    .barra-controles {
        gap: 6px;
    }

    .valor-atual {
        min-width: 58px;
        font-size: 12px;
    }

    .botoes-status button {
        width: 26px;
        height: 26px;
    }
}
</style>
</head>

<body>
<div class="container">
    <h1>Atributos</h1>

    <section class="status">
        <div class="status-titulo">
            <div class="nome-status">
                <span class="icone-status">❤️</span>
                <h2>Vida</h2>
            </div>

            <label class="maximo">
                Máx.
                <input type="number" id="maxVida" min="1"
                    onchange="alterarMaximo('vida', this.value)">
            </label>
        </div>

        <div class="barra-controles">
            <div class="barra">
                <div class="preenchimento vida" id="barraVida"></div>
            </div>

            <div class="botoes-status">
                <button onclick="alterarStatus('vida', -1)" aria-label="Diminuir vida">−</button>
                <span class="valor-atual" id="valorVida">10 / 10</span>
                <button onclick="alterarStatus('vida', 1)" aria-label="Aumentar vida">+</button>
            </div>
        </div>
    </section>

    <section class="status">
        <div class="status-titulo">
            <div class="nome-status">
                <span class="icone-status">🧠</span>
                <h2>Sanidade</h2>
            </div>

            <label class="maximo">
                Máx.
                <input type="number" id="maxSanidade" min="1"
                    onchange="alterarMaximo('sanidade', this.value)">
            </label>
        </div>

        <div class="barra-controles">
            <div class="barra">
                <div class="preenchimento sanidade" id="barraSanidade"></div>
            </div>

            <div class="botoes-status">
                <button onclick="alterarStatus('sanidade', -1)" aria-label="Diminuir sanidade">−</button>
                <span class="valor-atual" id="valorSanidade">10 / 10</span>
                <button onclick="alterarStatus('sanidade', 1)" aria-label="Aumentar sanidade">+</button>
            </div>
        </div>
    </section>

    <section class="status">
        <div class="status-titulo">
            <div class="nome-status">
                <span class="icone-status">🗡️</span>
                <h2>Pontos de Esforço</h2>
            </div>

            <label class="maximo">
                Máx.
                <input type="number" id="maxEsforco" min="1"
                    onchange="alterarMaximo('esforco', this.value)">
            </label>
        </div>

        <div class="barra-controles">
            <div class="barra">
                <div class="preenchimento esforco" id="barraEsforco"></div>
            </div>

            <div class="botoes-status">
                <button onclick="alterarStatus('esforco', -1)" aria-label="Diminuir pontos de esforço">−</button>
                <span class="valor-atual" id="valorEsforco">5 / 5</span>
                <button onclick="alterarStatus('esforco', 1)" aria-label="Aumentar pontos de esforço">+</button>
            </div>
        </div>
    </section>
</div>

<div class="menu">
    <div class="menu-opcoes" id="menuOpcoes">
        <a href="ficha-final.html">Ficha</a>
        <a href="dados.html">Dados</a>
        <a href="atributos.html">Atributos</a>
    </div>

    <button class="menu-botao" onclick="alternarMenu()">☰</button>
</div>

<script>
const statusPadrao = {
    vida: { atual: 30, maximo: 30 },
    sanidade: { atual: 33, maximo: 33 },
    esforco: { atual: 52, maximo: 52 }
};

function carregarStatus() {
    try {
        const salvo = JSON.parse(localStorage.getItem("statusFicha"));

        if (salvo) {
            return {
                vida: { ...statusPadrao.vida, ...(salvo.vida || {}) },
                sanidade: { ...statusPadrao.sanidade, ...(salvo.sanidade || {}) },
                esforco: { ...statusPadrao.esforco, ...(salvo.esforco || {}) }
            };
        }
    } catch (erro) {
        console.error("Erro ao carregar status:", erro);
    }

    return JSON.parse(JSON.stringify(statusPadrao));
}

let statusFicha = carregarStatus();

function salvarStatus() {
    localStorage.setItem("statusFicha", JSON.stringify(statusFicha));
}

function capitalizar(texto) {
    return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function atualizarTela() {
    ["vida", "sanidade", "esforco"].forEach(tipo => {
        const status = statusFicha[tipo];
        status.maximo = Math.max(1, Number(status.maximo) || 1);
        status.atual = Math.max(0, Math.min(
            status.maximo,
            Number(status.atual) || 0
        ));

        const nome = capitalizar(tipo);

        document.getElementById("valor" + nome).textContent =
            status.atual + " / " + status.maximo;

        document.getElementById("barra" + nome).style.width =
            (status.atual / status.maximo * 100) + "%";

        document.getElementById("max" + nome).value = status.maximo;
    });

    salvarStatus();
}

function alterarStatus(tipo, quantidade) {
    statusFicha[tipo].atual += quantidade;
    atualizarTela();
}

function alterarMaximo(tipo, valor) {
    statusFicha[tipo].maximo = Math.max(1, parseInt(valor, 10) || 1);
    atualizarTela();
}

function alternarMenu() {
    document.getElementById("menuOpcoes").classList.toggle("aberto");
}

atualizarTela();
</script>
</body>
</html>
