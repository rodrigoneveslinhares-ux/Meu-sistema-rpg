<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status da Ficha</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;padding:20px}
main{max-width:550px;margin:auto}
h1,h2{color:#00ff66}
.barra{margin:20px 0}
.info{display:flex;justify-content:space-between;align-items:center;gap:8px}
input{width:65px;padding:8px;background:#171717;color:white;border:1px solid #555;border-radius:5px}
progress{width:100%;height:12px;appearance:none}
progress::-webkit-progress-bar{background:#252525;border-radius:8px}
#vida::-webkit-progress-value{background:#ff3333}
#sanidade::-webkit-progress-value{background:#3399ff}
#pe::-webkit-progress-value{background:#ffb000}
button{width:100%;padding:13px;margin-top:12px;background:#00ff66;color:#000;border:0;border-radius:7px;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Status do personagem</h1>
<div id="status"></div>
<h2>Atributos</h2>
<div id="atributos"></div>
<button onclick="salvar()">Salvar status</button>
<button onclick="location.href='ficha-final.html'">Voltar à ficha</button>
<button onclick="location.href='dados.html'">Dados e perícias</button>
</main>
<script>
const j=sessionStorage.getItem("jogadorAtual");
if(!["Brayan","Vitor","Sofia"].includes(j))location.replace("jogadores.html");
const key=k=>"jogador_"+j.toLowerCase()+"_"+k;
let status=JSON.parse(localStorage.getItem(key("statusFicha"))||'{"vida":30,"vidaMax":30,"sanidade":33,"sanidadeMax":33,"pe":52,"peMax":52}');
const tipos=[
["vida","Vida","#ff3333"],["sanidade","Sanidade","#3399ff"],["pe","Pontos de Esforço","#ffb000"]
];
document.getElementById("status").innerHTML=tipos.map(([id,nome])=>`
<div class="barra">
<div class="info"><strong>${nome}</strong>
<div><input id="${id}" type="number" min="0" value="${status[id]}"> /
<input id="${id}Max" type="number" min="1" value="${status[id+"Max"]}"></div></div>
<progress id="${id}Bar" max="${status[id+"Max"]}" value="${status[id]}"></progress>
</div>`).join("");
tipos.forEach(([id])=>{
const atual=document.getElementById(id),max=document.getElementById(id+"Max"),bar=document.getElementById(id+"Bar");
function update(){bar.max=Math.max(1,Number(max.value));bar.value=Math.min(Number(atual.value),bar.max);}
atual.addEventListener("input",update);max.addEventListener("input",update);
});
const attrs=JSON.parse(localStorage.getItem(key("atributos"))||"{}");
document.getElementById("atributos").innerHTML=Object.entries(attrs).map(([n,v])=>`<p>${n.charAt(0).toUpperCase()+n.slice(1)}: ${v}</p>`).join("")||"Nenhum atributo salvo.";
function salvar(){
tipos.forEach(([id])=>{
status[id]=Math.max(0,Number(document.getElementById(id).value)||0);
status[id+"Max"]=Math.max(1,Number(document.getElementById(id+"Max").value)||1);
});
localStorage.setItem(key("statusFicha"),JSON.stringify(status));
alert("Status salvos!");
}
</script>
</body>
</html>
