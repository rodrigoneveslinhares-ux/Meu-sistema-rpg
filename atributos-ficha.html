
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atributos da Ficha</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    margin: 0 0 25px;
    font-size: 27px;
}

/* DESENHO DOS ATRIBUTOS */

.diagrama {
    position: relative;
    width: 100%;
    max-width: 620px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 28px;
}

.centro {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 40%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 5px solid white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #111;
    z-index: 1;
}

.centro span {
    font-family: Georgia, serif;
    font-size: clamp(16px, 4.5vw, 30px);
    font-weight: bold;
    letter-spacing: 1px;
}

.ligacao {
    position: absolute;
    height: 5px;
    background: white;
    transform-origin: left center;
    z-index: 0;
}

.ligacao-agi {
    width: 29%;
    left: 50%;
    top: 25%;
    transform: rotate(120deg);
}

.ligacao-int {
    width: 29%;
    left: 50%;
    top: 25%;
    transform: rotate(60deg);
}

.ligacao-for {
    width: 29%;
    left: 50%;
    top: 75%;
    transform: rotate(240deg);
}

.ligacao-pre {
    width: 29%;
    left: 50%;
    top: 75%;
    transform: rotate(300deg);
}

.ligacao-vig {
    width: 30%;
    left: 50%;
    top: 50%;
    transform: rotate(90deg);
}

.no-atributo {
    position: absolute;
    width: 34%;
    aspect-ratio: 1;
    border: 4px solid white;
    border-radius: 50%;
    background: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 2;
}

.no-atributo .numero {
    font-size: clamp(28px, 8vw, 52px);
    font-weight: normal;
    line-height: 1;
    margin-bottom: 9px;
}

.no-atributo .nome {
    font-size: clamp(10px, 2.5vw, 17px);
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 3px;
}

.no-atributo .sigla {
    font-family: Georgia, serif;
    font-size: clamp(19px, 5vw, 31px);
    font-weight: bold;
}

.agi {
    top: 0;
    left: 50%;
    transform: translateX(-50%);
}

.for {
    top: 25%;
    left: 0;
}

.int {
    top: 25%;
    right: 0;
}

.pre {
    bottom: 0;
    left: 10%;
}

.vig {
    bottom: 0;
    right: 10%;
}

/* BARRAS DE STATUS */

.status {
    margin-bottom: 28px;
}

.status-titulo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.nome-status {
    display: flex;
    align-items: center;
    gap: 8px;
}

.nome-status h2 {
    margin: 0;
    font-size: 17px;
}

.icone-status {
    font-size: 24px;
}

.maximo {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #ccc;
    white-space: nowrap;
}

.maximo input {
    width: 55px;
    padding: 5px;
    background: #222;
    color: white;
    border: 1px solid #555;
    text-align: center;
    font-size: 14px;
}

.barra-controles {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
}

.barra {
    flex: 1;
    min-width: 0;
    height: 12px;
    background: #444;
    border: 2px solid #000;
    overflow: hidden;
}

.preenchimento {
    width: 100%;
    height: 100%;
    transition: width 0.2s ease;
}

.vida {
    background: #e31324;
}

.sanidade {
    background: #2878e8;
}

.esforco {
    background: #f0a020;
}

.botoes-status {
    display: flex;
    align-items: center;
    gap: 5px;
}

.botoes-status button {
    width: 27px;
    height: 27px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #292929;
    color: white;
    border: 1px solid #555;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.valor-atual {
    min-width: 58px;
    text-align: center;
    font-size: 12px;
    white-space: nowrap;
}

/* MENU */

.menu {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 10;
}

.menu-botao {
    width: 52px;
    height: 52px;
    border: 2px solid #555;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.menu-opcoes {
    display: none;
    position: absolute;
    right: 0;
    bottom: 62px;
    width: 160px;
    padding: 8px;
    background: #222;
    border: 1px solid #555;
}

.menu-opcoes.aberto {
    display: block;
}

.menu-opcoes a {
    display: block;
    padding: 12px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid #444;
}

.menu-opcoes a:last-child {
    border-bottom: none;
}

.menu-opcoes a:hover {
    background: #383838;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    h1 {
        font-size: 24px;
    }

    .no-atributo {
        border-width: 3px;
    }

    .centro {
        border-width: 3px;
    }

    .status-titulo {
        flex-wrap: wrap;
    }

    .nome-status h2 {
        font-size: 15px;
    }

    .barra-controles {
        gap: 5px;
    }

    .valor-atual {
        min-width: 49px;
        font-size: 11px;
    }

    .botoes-status button {
        width: 23px;
        height: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Atributos</h1>

    <div class="diagrama">

        <div class="ligacao ligacao-agi"></div>
        <div class="ligacao ligacao-int"></div>
        <div class="ligacao ligacao-for"></div>
        <div class="ligacao ligacao-pre"></div>
        <div class="ligacao ligacao-vig"></div>

        <div class="centro">
            <span>ATRIBUTOS</span>
        </div>

        <div class="no-atributo agi">
            <div class="numero" id="valorAgilidade">0</div>
            <div class="nome">Agilidade</div>
            <div class="sigla">AGI</div>
        </div>

        <div class="no-atributo for">
            <div class="numero" id="valorForca">0</div>
            <div class="nome">Força</div>
            <div class="sigla">FOR</div>
        </div>

        <div class="no-atributo int">
            <div class="numero" id="valorIntelecto">0</div>
            <div class="nome">Intelecto</div>
            <div class="sigla">INT</div>
        </div>

        <div class="no-atributo pre">
            <div class="numero" id="valorPresenca">0</div>
            <div class="nome">Presença</div>
            <div class="sigla">PRE</div>
        </div>

        <div class="no-atributo vig">
            <div class="numero" id="valorVigor">0</div>
            <div class="nome">Vigor</div>
            <div class="sigla">VIG</div>
        </div>

    </div>

    <section class="status">
        <div class="status-titulo">
            <div class="nome-status">
                <span class="icone-status">❤️</span>
                <h2>Vida</h2>
            </div>

            <label class="maximo">
                Máx.
                <input type="number" id="maxVida" min="1"
                    onchange="alterarMaximo('vida', this.value)">
            </label>
        </div>

        <div class="barra-controles">
            <div class="barra">
                <div class="preenchimento vida" id="barraVida"></div>
            </div>

            <div class="botoes-status">
                <button onclick="alterarStatus('vida', -1)">−</button>
                <span class="valor-atual" id="valorVida">30 / 30</span>
                <button onclick="alterarStatus('vida', 1)">+</button>
            </div>
        </div>
    </section>

    <section class="status">
        <div class="status-titulo">
            <div class="nome-status">
                <span class="icone-status">🧠</span>
                <h2>Sanidade</h2>
            </div>

            <label class="maximo">
                Máx.
                <input type="number" id="maxSanidade" min="1"
                    onchange="alterarMaximo('sanidade', this.value)">
            </label>
        </div>

        <div class="barra-controles">
            <div class="barra">
                <div class="preenchimento sanidade" id="barraSanidade"></div>
            </div>

            <div class="botoes-status">
                <button onclick="alterarStatus('sanidade', -1)">−</button>
                <span class="valor-atual" id="valorSanidade">33 / 33</span>
                <button onclick="alterarStatus('sanidade', 1)">+</button>
            </div>
        </div>
    </section>

    <section class="status">
        <div class="status-titulo">
            <div class="nome-status">
                <span class="icone-status">🗡️</span>
                <h2>Pontos de Esforço</h2>
            </div>

            <label class="maximo">
                Máx.
                <input type="number" id="maxEsforco" min="1"
                    onchange="alterarMaximo('esforco', this.value)">
            </label>
        </div>

        <div class="barra-controles">
            <div class="barra">
                <div class="preenchimento esforco" id="barraEsforco"></div>
            </div>

            <div class="botoes-status">
                <button onclick="alterarStatus('esforco', -1)">−</button>
                <span class="valor-atual" id="valorEsforco">52 / 52</span>
                <button onclick="alterarStatus('esforco', 1)">+</button>
            </div>
        </div>
    </section>

</div>

<div class="menu">
    <div class="menu-opcoes" id="menuOpcoes">
        <a href="ficha-final.html">Ficha</a>
        <a href="dados.html">Dados</a>
        <a href="atributos.html">Atributos</a>
    </div>

    <button class="menu-botao" onclick="alternarMenu()">☰</button>
</div>

<script>
const statusPadrao = {
    vida: { atual: 30, maximo: 30 },
    sanidade: { atual: 33, maximo: 33 },
    esforco: { atual: 52, maximo: 52 }
};

function carregarStatus() {
    try {
        const salvo = JSON.parse(localStorage.getItem("statusFicha"));

        if (salvo) {
            return {
                vida: { ...statusPadrao.vida, ...(salvo.vida || {}) },
                sanidade: { ...statusPadrao.sanidade, ...(salvo.sanidade || {}) },
                esforco: { ...statusPadrao.esforco, ...(salvo.esforco || {}) }
            };
        }
    } catch (erro) {
        console.error("Erro ao carregar status:", erro);
    }

    return JSON.parse(JSON.stringify(statusPadrao));
}

let statusFicha = carregarStatus();

function atualizarAtributos() {
    let atributos = {};

    try {
        atributos = JSON.parse(localStorage.getItem("atributos")) || {};
    } catch (erro) {
        console.error("Erro ao carregar atributos:", erro);
    }

    document.getElementById("valorAgilidade").textContent =
        atributos.agilidade ?? 0;

    document.getElementById("valorForca").textContent =
        atributos.forca ?? 0;

    document.getElementById("valorIntelecto").textContent =
        atributos.intelecto ?? 0;

    document.getElementById("valorPresenca").textContent =
        atributos.presenca ?? 0;

    document.getElementById("valorVigor").textContent =
        atributos.vigor ?? 0;
}

function salvarStatus() {
    localStorage.setItem("statusFicha", JSON.stringify(statusFicha));
}

function capitalizar(texto) {
    return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function atualizarTela() {
    ["vida", "sanidade", "esforco"].forEach(tipo => {
        const status = statusFicha[tipo];
        status.maximo = Math.max(1, Number(status.maximo) || 1);
        status.atual = Math.max(
            0,
            Math.min(status.maximo, Number(status.atual) || 0)
        );

        const nome = capitalizar(tipo);

        document.getElementById("valor" + nome).textContent =
            status.atual + " / " + status.maximo;

        document.getElementById("barra" + nome).style.width =
            (status.atual / status.maximo * 100) + "%";

        document.getElementById("max" + nome).value = status.maximo;
    });

    salvarStatus();
}

function alterarStatus(tipo, quantidade) {
    statusFicha[tipo].atual += quantidade;
    atualizarTela();
}

function alterarMaximo(tipo, valor) {
    statusFicha[tipo].maximo = Math.max(1, parseInt(valor, 10) || 1);
    atualizarTela();
}

function alternarMenu() {
    document.getElementById("menuOpcoes").classList.toggle("aberto");
}

atualizarAtributos();
atualizarTela();
</script>

</body>
</html>
