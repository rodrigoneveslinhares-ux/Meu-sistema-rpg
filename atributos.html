<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atributos</title>
  
    <style> 
        body {
            margin: 0;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .origem {
            text-align: center;
            color: #aaa;
            margin-bottom: 10px;
        }

        .pontos {
            text-align: center;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .atributo {
            background: #181818;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nome {
            font-size: 18px;
        }

        .controles {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controles button {
            width: 40px;
            height: 40px;
            background: #292929;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 22px;
            cursor: pointer;
        }

        .valor {
            width: 20px;
            text-align: center;
            font-size: 20px;
        }

        .continuar {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            background: #292929;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>ATRIBUTOS</h1>

    <div class="origem">
        Origem: <strong id="nomeOrigem"></strong>
    </div>

    <div class="pontos">
        Pontos disponíveis:
        <strong id="pontos">4</strong>
    </div>


    <!-- INTELECTO -->

    <div class="atributo">

        <span class="nome">
            Intelecto
        </span>

        <div class="controles">

            <button onclick="diminuir('intelecto')">
                −
            </button>

            <span
                class="valor"
                id="intelecto"
            >
                0
            </span>

            <button onclick="aumentar('intelecto')">
                +
            </button>

        </div>

    </div>


    <!-- AGILIDADE -->

    <div class="atributo">

        <span class="nome">
            Agilidade
        </span>

        <div class="controles">

            <button onclick="diminuir('agilidade')">
                −
            </button>

            <span
                class="valor"
                id="agilidade"
            >
                0
            </span>

            <button onclick="aumentar('agilidade')">
                +
            </button>

        </div>

    </div>


    <!-- FORÇA -->

    <div class="atributo">

        <span class="nome">
            Força
        </span>

        <div class="controles">

            <button onclick="diminuir('forca')">
                −
            </button>

            <span
                class="valor"
                id="forca"
            >
                0
            </span>

            <button onclick="aumentar('forca')">
                +
            </button>

        </div>

    </div>


    <!-- VIGOR -->

    <div class="atributo">

        <span class="nome">
            Vigor
        </span>

        <div class="controles">

            <button onclick="diminuir('vigor')">
                −
            </button>

            <span
                class="valor"
                id="vigor"
            >
                0
            </span> 

            <button onclick="aumentar('vigor')">
                +
            </button>

        </div>

    </div>


    <!-- PRESENÇA -->

    <div class="atributo">

        <span class="nome">
            Presença
        </span>

        <div class="controles">

            <button onclick="diminuir('presenca')">
                −
            </button>

            <span
                class="valor"
                id="presenca"
            >
                0
            </span>

            <button onclick="aumentar('presenca')">
                +
            </button>

        </div>

    </div>


    <button
        class="continuar"
        onclick="continuar()"
    >
        CONTINUAR
    </button>


    <script>

        let pontos = 4;


        let atributos = {

            intelecto: 0,

            agilidade: 0,

            forca: 0,

            vigor: 0,

            presenca: 0

        };


        let origem =
            localStorage.getItem("origem");


        document.getElementById(
            "nomeOrigem"
        ).textContent =
            origem || "Nenhuma";


        /* BÔNUS DA ORIGEM */

        if (origem === "Lutador") {

            atributos.forca = 1;

        }


        if (origem === "Professor") {

            atributos.intelecto = 1;

        }


        if (origem === "Apresentador") {

            atributos.presenca = 1;

        }


        if (origem === "Atleta") {

            atributos.vigor = 1;

        }


        function aumentar(atributo) {

            if (pontos > 0) {

                atributos[atributo]++;

                pontos--;

                atualizar();

            }

        }


        function diminuir(atributo) {

            let minimo = 0;


            if (
                origem === "Lutador" &&
                atributo === "forca"
            ) {

                minimo = 1;

            }


            if (
                origem === "Professor" &&
                atributo === "intelecto"
            ) {

                minimo = 1;

            }


            if (
                origem === "Apresentador" &&
                atributo === "presenca"
            ) {

                minimo = 1;

            }


            if (
                origem === "Atleta" &&
                atributo === "vigor"
            ) {

                minimo = 1;

            }


            if (atributos[atributo] > minimo) {

                atributos[atributo]--;

                pontos++;

                atualizar();

            }

        }


        function atualizar() {

            document.getElementById(
                "pontos"
            ).textContent =
                pontos;


            document.getElementById(
                "intelecto"
            ).textContent =
                atributos.intelecto;


            document.getElementById(
                "agilidade"
            ).textContent =
                atributos.agilidade;


            document.getElementById(
                "forca"
            ).textContent =
                atributos.forca;


            document.getElementById(
                "vigor"
            ).textContent =
                atributos.vigor;


            document.getElementById(
                "presenca"
            ).textContent =
                atributos.presenca;

        }


        function continuar() {

            localStorage.setItem(
                "atributos",
                JSON.stringify(atributos)
            );


            window.location.href =
                "ficha-final.html";

        }


        atualizar();

    </script>

</body>
</html>
