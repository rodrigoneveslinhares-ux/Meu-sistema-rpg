<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atributos </title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;padding:20px}
h1{text-align:center;color:#00ff66}
main{max-width:500px;margin:auto}
.linha{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#151515;margin:10px 0;border:1px solid #333;border-radius:8px}
button{background:#00ff66;color:#000;border:0;border-radius:6px;padding:9px 14px;font-weight:bold}
.valor{margin:0 15px}
.avancar{width:100%;padding:15px;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>Atributos</h1>
<p>Pontos disponíveis: <strong id="restantes">4</strong></p>
<div id="lista"></div>
<button class="avancar" onclick="continuar()">Continuar</button>
</main>
<script>
const j=sessionStorage.getItem("jogadorAtual");
if(!["Brayan","Vitor","Sofia"].includes(j))location.replace("jogadores.html");
const key=k=>"jogador_"+j.toLowerCase()+"_"+k;
const nomes=["Intelecto","Agilidade","Força","Vigor","Presença"];
const ids=["intelecto","agilidade","forca","vigor","presenca"];
const origem=localStorage.getItem(key("origem"))||"";
let valores=JSON.parse(localStorage.getItem(key("atributos"))||"null");

if(!valores){
valores={intelecto:0,agilidade:0,forca:0,vigor:0,presenca:0};
const bonus={Lutador:"forca",Professor:"intelecto",Atleta:"vigor",Apresentador:"presenca"};
if(bonus[origem])valores[bonus[origem]]=1;
}

function total(){return Object.values(valores).reduce((a,b)=>a+b,0);}
function render(){
document.getElementById("lista").innerHTML=nomes.map((n,i)=>`
<div class="linha">
<strong>${n}</strong>
<div>
<button onclick="alterar('${ids[i]}',-1)">−</button>
<strong class="valor">${valores[ids[i]]}</strong>
<button onclick="alterar('${ids[i]}',1)">+</button>
</div>
</div>`).join("");
document.getElementById("restantes").textContent=4-(total()-Object.values(valores).filter((v,i)=>false).length);
}
function alterar(id,d){
const bonus={Lutador:"forca",Professor:"intelecto",Atleta:"vigor",Apresentador:"presenca"};
const base=bonus[origem]===id?1:0;
if(d>0&&total()>=4)return;
if(d<0&&valores[id]<=base)return;
valores[id]+=d;
render();
}
function continuar(){
if(total()!==4){alert("Distribua os 4 pontos disponíveis.");return;}
localStorage.setItem(key("atributos"),JSON.stringify(valores));
location.href="ficha-final.html";
}
render();
</script>
</body>
</html>
