
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            padding-bottom: 100px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .pericia {
            background: #181818;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .nome {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .linha {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .caixa {
            width: 48px;
            height: 42px;
            box-sizing: border-box;
            background: #0b0b0b;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
        }

        .caixa-automatico {
            color: #aaa;
        }

        .botao-dado {
            width: 48px;
            height: 42px;
            background: #292929;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 22px;
            cursor: pointer;
        }

        .resultado {
            margin-top: 10px;
            color: #aaa;
            min-height: 20px;
        }

        .menu-voltar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 15px;
            background: #292929;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <h1>🎲 DADOS</h1>

    <div class="subtitulo">
        Role 1d20 + atributo + bônus de origem + bônus manual
    </div>

    <div id="listaPericias"></div>

    <a class="menu-voltar" href="ficha-final.html">
        ← Voltar para a ficha
    </a>

    <script>
        const pericias = [
            { nome: "Acrobacia", atributo: "agilidade" },
            { nome: "Adestramento", atributo: "presenca" },
            { nome: "Artes", atributo: "presenca" },
            { nome: "Atletismo", atributo: "forca" },
            { nome: "Atualidades", atributo: "intelecto" },
            { nome: "Ciências", atributo: "intelecto" },
            { nome: "Crime", atributo: "agilidade" },
            { nome: "Diplomacia", atributo: "presenca" },
            { nome: "Enganação", atributo: "presenca" },
            { nome: "Fortitude", atributo: "vigor" },
            { nome: "Furtividade", atributo: "agilidade" },
            { nome: "Iniciativa", atributo: "agilidade" },
            { nome: "Intimidação", atributo: "presenca" },
            { nome: "Intuição", atributo: "presenca" },
            { nome: "Investigação", atributo: "intelecto" },
            { nome: "Luta", atributo: "forca" },
            { nome: "Medicina", atributo: "intelecto" },
            { nome: "Ocultismo", atributo: "intelecto" },
            { nome: "Percepção", atributo: "presenca" },
            { nome: "Pilotagem", atributo: "agilidade" },
            { nome: "Pontaria", atributo: "agilidade" },
            { nome: "Profissão", atributo: "intelecto" },
            { nome: "Reflexos", atributo: "agilidade" },
            { nome: "Religião", atributo: "presenca" },
            { nome: "Sobrevivência", atributo: "intelecto" },
            { nome: "Tática", atributo: "intelecto" },
            { nome: "Tecnologia", atributo: "intelecto" },
            { nome: "Vontade", atributo: "presenca" }
        ];

        function lerLocalStorage(chave, padrao = {}) {
            try {
                return JSON.parse(localStorage.getItem(chave)) || padrao;
            } catch (erro) {
                return padrao;
            }
        }

        let bonusManuais = lerLocalStorage("bonusManuaisPericias");
        let resultadosSalvos = lerLocalStorage("resultadosPericias");

        const lista = document.getElementById("listaPericias");

        function obterAtributos() {
            return lerLocalStorage("atributos");
        }

        function obterBonusOrigem() {
            return lerLocalStorage("bonusPericias");
        }

        function obterBonusAutomatico(pericia) {
            const atributos = obterAtributos();
            const bonusOrigem = obterBonusOrigem();

            const bonusAtributo = Number(atributos[pericia.atributo]) || 0;
            const bonusDaOrigem = Number(bonusOrigem[pericia.nome]) || 0;

            return {
                bonusAtributo,
                bonusDaOrigem,
                total: bonusAtributo + bonusDaOrigem
            };
        }

        function salvarBonusManuais() {
            localStorage.setItem(
                "bonusManuaisPericias",
                JSON.stringify(bonusManuais)
            );
        }

        function salvarResultados() {
            localStorage.setItem(
                "resultadosPericias",
                JSON.stringify(resultadosSalvos)
            );
        }

        pericias.forEach((pericia, indice) => {
            const bonus = obterBonusAutomatico(pericia);
            const chave = pericia.nome;
            const manualSalvo = Number(bonusManuais[chave]) || 0;

            const div = document.createElement("div");
            div.className = "pericia";

            const nome = document.createElement("div");
            nome.className = "nome";
            nome.textContent = pericia.nome;

            const linha = document.createElement("div");
            linha.className = "linha";

            const caixaAutomatica = document.createElement("input");
            caixaAutomatica.className = "caixa caixa-automatico";
            caixaAutomatica.id = "automatico-" + indice;
            caixaAutomatica.value = bonus.total;
            caixaAutomatica.readOnly = true;
            caixaAutomatica.title = "Atributo + bônus da origem";

            const caixaManual = document.createElement("input");
            caixaManual.className = "caixa";
            caixaManual.id = "manual-" + indice;
            caixaManual.type = "number";
            caixaManual.value = manualSalvo;
            caixaManual.title = "Bônus manual";

            caixaManual.addEventListener("input", () => {
                bonusManuais[chave] = Number(caixaManual.value) || 0;
                salvarBonusManuais();
            });

            const botaoDado = document.createElement("button");
            botaoDado.className = "botao-dado";
            botaoDado.textContent = "🎲";
            botaoDado.title = "Rolar 1d20";
            botaoDado.addEventListener("click", () => rolar(indice));

            linha.append(caixaAutomatica, caixaManual, botaoDado);

            const resultado = document.createElement("div");
            resultado.className = "resultado";
            resultado.id = "resultado-" + indice;
            resultado.textContent = resultadosSalvos[chave] || "";

            div.append(nome, linha, resultado);
            lista.appendChild(div);
        });

        function atualizarBonusAutomaticos() {
            pericias.forEach((pericia, indice) => {
                const bonus = obterBonusAutomatico(pericia);
                document.getElementById("automatico-" + indice).value =
                    bonus.total;
            });
        }

        function rolar(indice) {
            const pericia = pericias[indice];
            const bonus = obterBonusAutomatico(pericia);

            const bonusManual =
                Number(document.getElementById("manual-" + indice).value) || 0;

            bonusManuais[pericia.nome] = bonusManual;
            salvarBonusManuais();

            const dado = Math.floor(Math.random() * 20) + 1;
            const total = dado + bonus.total + bonusManual;

            let texto = `🎲 ${dado} + ${bonus.bonusAtributo}`;

            if (bonus.bonusDaOrigem !== 0) {
                texto += ` + ${bonus.bonusDaOrigem} origem`;
            }

            if (bonusManual !== 0) {
                texto += ` + (${bonusManual})`;
            }

            texto += ` = ${total}`;

            const dificuldade = descobrirResultado(
                dado,
                bonus.total + bonusManual
            );

            if (dificuldade) {
                texto += ` — ${dificuldade}`;
            }

            document.getElementById("resultado-" + indice).textContent = texto;

            resultadosSalvos[pericia.nome] = texto;
            salvarResultados();
        }

        function descobrirResultado(dado, bonus) {
            if (bonus < 1) return null;
            if (bonus > 18) bonus = 18;

            const tabela = {
                1:  { normal: 20, bom: null, extremo: null },
                2:  { normal: 19, bom: 20, extremo: null },
                3:  { normal: 18, bom: 20, extremo: null },
                4:  { normal: 17, bom: 19, extremo: null },
                5:  { normal: 16, bom: 19, extremo: 20 },
                6:  { normal: 15, bom: 18, extremo: 20 },
                7:  { normal: 14, bom: 18, extremo: 20 },
                8:  { normal: 13, bom: 17, extremo: 20 },
                9:  { normal: 12, bom: 17, extremo: 20 },
                10: { normal: 11, bom: 16, extremo: 19 },
                11: { normal: 10, bom: 16, extremo: 19 },
                12: { normal: 9, bom: 15, extremo: 19 },
                13: { normal: 8, bom: 15, extremo: 19 },
                14: { normal: 7, bom: 14, extremo: 19 },
                15: { normal: 6, bom: 14, extremo: 18 },
                16: { normal: 5, bom: 13, extremo: 18 },
                17: { normal: 4, bom: 13, extremo: 18 },
                18: { normal: 3, bom: 12, extremo: 18 }
            };

            const faixa = tabela[bonus];
            if (!faixa) return null;

            if (faixa.extremo !== null && dado >= faixa.extremo) {
                return "EXTREMO";
            }

            if (faixa.bom !== null && dado >= faixa.bom) {
                return "BOM";
            }

            if (dado >= faixa.normal) {
                return "NORMAL";
            }

            return "FALHA";
        }

        // Atualiza os bônus se os atributos forem alterados em outra página.
        window.addEventListener("pageshow", atualizarBonusAutomaticos);

        window.addEventListener("storage", evento => {
            if (evento.key === "atributos" || evento.key === "bonusPericias") {
                atualizarBonusAutomaticos();
            }
        });
    </script>

</body>
</html>
